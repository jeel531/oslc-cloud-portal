<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="darkShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Left Luxury Hexagon/Shield Emblem -->
  <g transform="translate(10, 10)">
    <!-- Outer Gold Border -->
    <polygon points="50,2 96,26 96,74 50,98 4,74 4,26" fill="url(#darkShield)" stroke="url(#goldGrad)" stroke-width="3.5" filter="url(#glow)" />
    <!-- Inner Accent Rim -->
    <polygon points="50,8 90,29 90,71 50,92 10,71 10,29" fill="none" stroke="url(#blueGrad)" stroke-width="1.8" stroke-opacity="0.85" />
    <!-- OSLC Monogram in Shield -->
    <text x="50" y="47" font-family="'Arial Black', 'Montserrat', Impact, sans-serif" font-size="24" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">OSLC</text>
    <text x="50" y="65" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="3">HOUSE</text>
    <line x1="22" y1="73" x2="78" y2="73" stroke="url(#goldLight)" stroke-width="1.5" />
    <text x="50" y="85" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="700" fill="#CBD5E1" text-anchor="middle" letter-spacing="1">EST. 2026</text>
  </g>

  <!-- Right Typography Section -->
  <g transform="translate(125, 18)">
    <!-- Main Brand Name -->
    <text x="0" y="34" font-family="'Arial Black', 'Montserrat', sans-serif" font-size="33" font-weight="900" fill="url(#goldGrad)" letter-spacing="2" filter="url(#glow)">OSLC HOUSE</text>
    <!-- Subtitle -->
    <text x="2" y="56" font-family="'Segoe UI', 'Roboto', sans-serif" font-size="14.5" font-weight="800" fill="#38BDF8" letter-spacing="1.5">OM SAI LATEST CREATION</text>
    <!-- Tagline & Creator Credit -->
    <text x="2" y="74" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.8">KARIGAR GATE PASS SYSTEM • <tspan fill="#F59E0B" font-weight="800">CREATED BY JEEL VAGHANI</tspan></text>
  </g>
</svg>
